# Familiar settings for checking the workflow, not an optimized compression scheme.
model: torchvision.resnet18
weights: ResNet18_Weights.IMAGENET1K_V1
data:
  raw_dir: data/raw/imagenetv2
  manifest: data/processed/imagenetv2/exploration.json
compression:
  implementation: factorized
  layers:
    layer4.0.conv2:
      factorization: Tucker
      rank: 0.75
      fixed_rank_modes: spatial
    layer4.1.conv2:
      factorization: Tucker
      rank: 0.75
      fixed_rank_modes: spatial
    fc:
      factorization: BlockTT
      rank: 0.75
      in_tensorized_features: [8, 8, 8]
      out_tensorized_features: [10, 10, 10]
runtime:
  seed: 2026
  device: cuda:0
  dtype: float32
  batch_size: 16
  workers: 0
  threads: 4
timing:
  seed: 2027
  input_shape: [1, 3, 224, 224]
  warmup: 20
  repeats: 100
tracking:
  uri: http://127.0.0.1:9361
  workspace: quirc
  experiment_name: model-compression
  run_name: resnet18-exploration-tucker-blocktt-075
output_root: results/runs
